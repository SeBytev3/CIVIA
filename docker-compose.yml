services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civia}
      POSTGRES_USER: ${POSTGRES_USER:-civia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_me}
    volumes:
      - civia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://civia:local_dev_change_me@db:5432/civia}
      GOOGLE_API_KEY_PRIMARY: ${GOOGLE_API_KEY_PRIMARY:-}
      GOOGLE_API_KEY_SECONDARY: ${GOOGLE_API_KEY_SECONDARY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-gemini-3.8-flash}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-qwen/qwen3.8-27b}
      AI_TERTIARY_MODEL: ${AI_TERTIARY_MODEL:-gemini-3.6-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-5}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-6000}
      FALLA_FORZADA: ${FALLA_FORZADA:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-civia-admin-demo-2026}
    volumes:
      - civia_uploads:/app/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 8
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 6
volumes:
  civia_postgres:
  civia_uploads:

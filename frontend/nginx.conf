server {
    listen 80;
    server_name _;

    client_max_body_size 12M;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location = /admin {
        return 308 /admin/;
    }

    location = /admin/manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~ ^/(admin/)?sw\.js$ {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        return 410;
    }

    location /admin/ {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

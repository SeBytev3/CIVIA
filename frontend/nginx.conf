server {
    listen 80;
    include /etc/nginx/civia-lan/listen.conf;
    server_name _;
    absolute_redirect off;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $civia_api http://api:8000;

    client_max_body_size 12M;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass $civia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass $civia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location = /admin {
        return 308 /admin/;
    }

    location = /app {
        return 308 /app/;
    }

    location ~ ^/(app|admin)/manifest\.webmanifest$ {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~ ^/((app|admin)/)?sw\.js$ {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        return 410;
    }

    location = /build.json {
        expires -1;
        try_files $uri =404;
    }

    location /app/ {
        try_files $uri $uri/ =404;
    }

    location /admin/ {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
